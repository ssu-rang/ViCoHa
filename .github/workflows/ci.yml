name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: go test ./...
      - run: go build ./...
      - run: python eval/test_run.py -v
